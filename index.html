<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poznámky z hodiny</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--bd:#e2e0d8;--ac:#2f6fed;--act:#fff;--rec:#d6372b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#212125;--tx:#ececea;--mut:#9a9992;--bd:#35353b;--ac:#6b9bff;--act:#101014;--rec:#ff6a5e}}
:root[data-theme="dark"]{--bg:#17171a;--card:#212125;--tx:#ececea;--mut:#9a9992;--bd:#35353b;--ac:#6b9bff;--act:#101014;--rec:#ff6a5e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:200px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 0;align-items:center}
button{font:inherit;padding:10px 16px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
button.rec{background:var(--rec);color:#fff;border-color:var(--rec);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.live{color:var(--mut);font-style:italic;min-height:1.5em;margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--rec);margin-right:6px;animation:b 1s infinite}
@keyframes b{50%{opacity:.25}}
h2{font-size:1.1rem;margin:18px 0 6px}
h3{font-size:1rem;margin:14px 0 4px}
ul{margin:4px 0;padding-left:22px}
.chip{display:inline-block;padding:2px 10px;margin:2px 4px 2px 0;border:1px solid var(--bd);border-radius:99px;font-size:.88rem}
.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.item:first-child{border-top:0}
.item small{color:var(--mut)}
.x{border:0;background:none;color:var(--mut);padding:0 6px}
.err{color:var(--rec)}
.note{color:var(--mut);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Poznámky z hodiny</h1>
<p class="sub">Nahraj hodinu, alebo vlož prepis, a dostaneš zhrnutie a poznámky.</p>

<section class="card">
  <label for="t">Názov hodiny</label>
  <input id="t" placeholder="napr. Biológia – bunka">
  <div class="row">
    <button id="mic" class="p">● Začať nahrávať</button>
    <button id="gen" class="p">Vytvoriť poznámky</button>
    <button id="clr">Vymazať</button>
  </div>
  <div class="live" id="live"></div>
  <label for="tx" style="margin-top:10px">Prepis hodiny (môžeš upraviť alebo vložiť vlastný)</label>
  <textarea id="tx" placeholder="Tu sa objaví prepis. Prepis zo zariadenia môžeš sem aj vložiť."></textarea>
  <p class="note" id="nomic" hidden>Diktovanie nie je v tomto prehliadači dostupné, vlož prepis ručne.</p>
</section>

<section class="card" id="out" hidden></section>

<section class="card">
  <h2 style="margin-top:0">Uložené hodiny</h2>
  <div id="list"></div>
  <p class="note" id="empty">Zatiaľ nič. Hodiny sa ukladajú iba v tomto prehliadači.</p>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
let dict=null,smp=null,listening=false,lessons=[],cur=null;

function load(){try{lessons=JSON.parse(localStorage.getItem('lessons')||'[]')}catch(e){lessons=[]}}
function store(){try{localStorage.setItem('lessons',JSON.stringify(lessons))}catch(e){}}

function el(tag,txt,cls){const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e}
function ul(arr){const u=el('ul');(arr||[]).forEach(x=>u.appendChild(el('li',String(x))));return u}

function render(r){
  const o=$('#out');o.hidden=false;o.replaceChildren();
  o.appendChild(el('h2',r.title||'Zhrnutie','')).style.marginTop='0';
  o.appendChild(el('p',r.summary||''));
  if(r.keyPoints&&r.keyPoints.length){o.appendChild(el('h2','Kľúčové body'));o.appendChild(ul(r.keyPoints))}
  if(r.notes&&r.notes.length){
    o.appendChild(el('h2','Poznámky'));
    r.notes.forEach(n=>{o.appendChild(el('h3',n.heading||''));o.appendChild(ul(n.points))});
  }
  if(r.terms&&r.terms.length){
    o.appendChild(el('h2','Pojmy'));
    r.terms.forEach(t=>o.appendChild(el('span',(t.term||'')+(t.meaning?': '+t.meaning:''),'chip')));
  }
  if(r.todo&&r.todo.length){o.appendChild(el('h2','Úlohy a termíny'));o.appendChild(ul(r.todo))}
  if(r.questions&&r.questions.length){o.appendChild(el('h2','Otázky na opakovanie'));o.appendChild(ul(r.questions))}
}

function renderList(){
  const L=$('#list');L.replaceChildren();
  $('#empty').hidden=lessons.length>0;
  lessons.forEach((l,i)=>{
    const d=el('div',null,'item');
    const left=el('div');left.appendChild(el('div',l.name||'Bez názvu'));
    left.appendChild(el('small',new Date(l.date).toLocaleString('sk-SK')+(l.result?' · so zhrnutím':'')));
    const x=el('button','✕','x');x.title='Zmazať';
    x.onclick=e=>{e.stopPropagation();lessons.splice(i,1);store();renderList()};
    d.onclick=()=>{cur=l.id;$('#t').value=l.name||'';$('#tx').value=l.text||'';l.result?render(l.result):$('#out').hidden=true;window.scrollTo({top:0,behavior:'smooth'})};
    d.append(left,x);L.appendChild(d);
  });
}

function saveCur(result){
  const name=$('#t').value.trim(),text=$('#tx').value;
  let l=lessons.find(x=>x.id===cur);
  if(!l){l={id:Date.now(),date:Date.now()};cur=l.id;lessons.unshift(l)}
  l.name=name;l.text=text;if(result)l.result=result;
  store();renderList();
}

async function generate(){
  const text=$('#tx').value.trim();
  if(text.length<40){alert('Prepis je príliš krátky. Nahraj hodinu alebo vlož text.');return}
  
  const b=$('#gen');b.disabled=true;b.textContent='Spracúvam…';
  const resp=await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:$('#t').value,text:text})});
    const r=await resp.json();if(!resp.ok)throw new Error(r.error||'Chyba služby');
    render(r);saveCur(r);
    $('#out').scrollIntoView({behavior:'smooth'});
  }catch(e){
    const o=$('#out');o.hidden=false;o.replaceChildren(el('p','Nepodarilo sa vytvoriť poznámky: '+((e&&e.message)||''),'err'));
  }
  b.disabled=false;b.textContent='Vytvoriť poznámky';
}

function setRec(on){
  listening=on;const m=$('#mic');
  m.className=on?'rec':'p';
  m.textContent=on?'■ Zastaviť nahrávanie':'● Začať nahrávať';
  if(!on)$('#live').textContent='';
}

async function toggleMic(){
  if(!dict)return;
  if(listening){try{await dict.stop()}catch(e){}saveCur();return}
  try{await dict.start()}catch(e){if(e&&e.code==='not_granted')alert('Prístup k mikrofónu nebol povolený.')}
}

$('#mic').onclick=toggleMic;
$('#gen').onclick=generate;
$('#clr').onclick=()=>{cur=null;$('#t').value='';$('#tx').value='';$('#out').hidden=true};
$('#tx').addEventListener('change',()=>{if($('#tx').value.trim())saveCur()});

load();renderList();

(()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$('#mic').hidden=true;$('#nomic').hidden=false;return}
  let rc=null,want=false;
  function mk(){
    rc=new SR();rc.lang='sk-SK';rc.continuous=true;rc.interimResults=true;
    rc.onresult=ev=>{let it='';for(let i=ev.resultIndex;i<ev.results.length;i++){const r=ev.results[i];if(r.isFinal){const t=$('#tx');t.value+=(t.value&&!/\s$/.test(t.value)?' ':'')+r[0].transcript.trim()}else it+=r[0].transcript}$('#live').textContent=it};
    rc.onend=()=>{if(want){try{rc.start()}catch(e){}}else setRec(false)};
    rc.onerror=e=>{if(e.error==='not-allowed'){want=false;alert('Prístup k mikrofónu nebol povolený.')}};
  }
  dict={start:async()=>{want=true;mk();rc.start();setRec(true)},stop:async()=>{want=false;rc.stop()}};
})();
</script>
</body>
</html>
